<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Football TV Planner</title>
        <meta
            name="description"
            content="Plan and track football TV schedules. Search for matches, build your watchlist, and manage your account — all in one place."
        />
        <meta name="theme-color" content="#2b2d3a" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Football TV Planner" />

            property="og:description"
            content="Plan and track football TV schedules. Search for matches, build your watchlist, and manage your account."
        />
        <meta property="og:image" content="/android-chrome-512x512.png" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Football TV Planner" />
        <meta
            name="twitter:description"
            content="Plan and track football TV schedules."
        />
        <meta name="twitter:image" content="/android-chrome-512x512.png" />

        <!-- Favicons -->
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon-16x16.png"
        />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />
        <link rel="manifest" href="/site.webmanifest" />
    </head>
    <body>
        <div id="root"></div>
        <script src="/env.js?v=%VITE_APP_VERSION%"></script>
