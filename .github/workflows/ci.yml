name: CI Build and Publish

on:
  push:
    branches: ["main", "develop", "feature/**", "release/**", "hotfix/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Build and test (dotnet)
        run: |
          dotnet build "FootballTvPlanner.slnx"
          dotnet test "FootballTvPlanner.slnx"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ./FootballTvPlanner.Web

      - name: Build and lint (npm)
        working-directory: ./FootballTvPlanner.Web
        run: |
          npm ci
          npm run lint
          npm run build

  docker:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    outputs:
      apiImage: ${{ steps.outputs.outputs.apiImage }}
      fixtureSyncImage: ${{ steps.outputs.outputs.fixtureSyncImage }}
      webImage: ${{ steps.outputs.outputs.webImage }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker metadata (api)
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO }}-api
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Build and push container image to registry (api)
        uses: docker/build-push-action@v7
        with:
          file: ./FootballTvPlanner.Api/Dockerfile
          context: .
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: GIT_COMMIT_SHA=${{ github.sha }}
          push: true
          provenance: false

      - name: Docker metadata (fixture-sync)
        id: meta-fixture-sync
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO }}-fixture-sync
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Build and push container image to registry (fixture-sync)
        uses: docker/build-push-action@v7
        with:
          file: ./FootballTvPlanner.FixtureSync/Dockerfile
          context: .
          tags: ${{ steps.meta-fixture-sync.outputs.tags }}
          labels: ${{ steps.meta-fixture-sync.outputs.labels }}
          build-args: GIT_COMMIT_SHA=${{ github.sha }}
          push: true
          provenance: false

      - name: Docker metadata (web)
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO }}-web
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Build and push container image to registry (web)
        uses: docker/build-push-action@v7
        with:
          file: ./FootballTvPlanner.Web/Dockerfile
          context: ./FootballTvPlanner.Web
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: GIT_COMMIT_SHA=${{ github.sha }}
          push: true
          provenance: false

      - name: Set outputs
        id: outputs
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "apiImage=ghcr.io/${REPO}-api:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "fixtureSyncImage=ghcr.io/${REPO}-fixture-sync:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "webImage=ghcr.io/${REPO}-web:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && 'production' || 'preview' }}
      cancel-in-progress: false
    steps:
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          API_IMAGE: ${{ needs.docker.outputs.apiImage }}
          WEB_IMAGE: ${{ needs.docker.outputs.webImage }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_API" ] || [ -z "$RENDER_DEPLOY_HOOK_WEB" ]; then
            echo "Render deploy hooks are not configured for this environment; skipping deploy."
            exit 0
          fi

          curl -fsS -X POST -G "$RENDER_DEPLOY_HOOK_API" --data-urlencode "imgURL=${API_IMAGE}"
          curl -fsS -X POST -G "$RENDER_DEPLOY_HOOK_WEB" --data-urlencode "imgURL=${WEB_IMAGE}"
