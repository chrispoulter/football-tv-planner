name: CI Build and Publish

on:
  push:
    branches: ["main", "develop", "feature/**", "release/**", "hotfix/**"]
  workflow_dispatch:

jobs:
  check:
    name: Build, Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Build and test (dotnet)
        run: |
          dotnet build "FootballTvPlanner.slnx"
          dotnet test "FootballTvPlanner.slnx"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ./FootballTvPlanner.Web

      - name: Build and lint (npm)
        working-directory: ./FootballTvPlanner.Web
        run: |
          npm ci
          npm run lint
          npm run build

  docker:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    outputs:
      apiImage: ${{ steps.outputs.outputs.apiImage }}
      fixtureSyncImage: ${{ steps.outputs.outputs.fixtureSyncImage }}
      webImage: ${{ steps.outputs.outputs.webImage }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Determine Version
        id: version_step
        run: |
          dotnet tool restore
          dotnet gitversion /output buildserver /updateprojectfiles

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set web app version
        working-directory: ./FootballTvPlanner.Web
        run: npm version "${{ env.GitVersion_SemVer }}-${{ env.GitVersion_ShortSha }}" --no-git-tag-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push container image to registry (api)
        uses: docker/build-push-action@v7
        with:
          file: ./FootballTvPlanner.Api/Dockerfile
          tags: |
            ghcr.io/${{ env.REPO }}-api:${{ env.GitVersion_SemVer }}
            ghcr.io/${{ env.REPO }}-api:${{ env.GitVersion_SemVer }}-${{ env.GitVersion_ShortSha }}
            ghcr.io/${{ env.REPO }}-api:${{ env.GitVersion_PreReleaseLabel || 'latest' }}
          context: .
          push: true
          provenance: false

      - name: Build and push container image to registry (fixture-sync)
        uses: docker/build-push-action@v7
        with:
          file: ./FootballTvPlanner.FixtureSync/Dockerfile
          tags: |
            ghcr.io/${{ env.REPO }}-fixture-sync:${{ env.GitVersion_SemVer }}
            ghcr.io/${{ env.REPO }}-fixture-sync:${{ env.GitVersion_SemVer }}-${{ env.GitVersion_ShortSha }}
            ghcr.io/${{ env.REPO }}-fixture-sync:${{ env.GitVersion_PreReleaseLabel || 'latest' }}
          context: .
          push: true
          provenance: false

      - name: Build and push container image to registry (web)
        uses: docker/build-push-action@v7
        with:
          file: ./FootballTvPlanner.Web/Dockerfile
          tags: |
            ghcr.io/${{ env.REPO }}-web:${{ env.GitVersion_SemVer }}
            ghcr.io/${{ env.REPO }}-web:${{ env.GitVersion_SemVer }}-${{ env.GitVersion_ShortSha }}
            ghcr.io/${{ env.REPO }}-web:${{ env.GitVersion_PreReleaseLabel || 'latest' }}
          context: ./FootballTvPlanner.Web
          push: true
          provenance: false

      - name: Set outputs
        id: outputs
        run: |
          echo "apiImage=ghcr.io/${REPO}-api:${GitVersion_SemVer}-${GitVersion_ShortSha}" >> "$GITHUB_OUTPUT"
          echo "fixtureSyncImage=ghcr.io/${REPO}-fixture-sync:${GitVersion_SemVer}-${GitVersion_ShortSha}" >> "$GITHUB_OUTPUT"
          echo "webImage=ghcr.io/${REPO}-web:${GitVersion_SemVer}-${GitVersion_ShortSha}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && 'production' || 'preview' }}
      cancel-in-progress: false
    steps:
      # Each GitHub environment (production, preview) holds the deploy hooks for its Render services
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
          API_IMAGE: ${{ needs.docker.outputs.apiImage }}
          WEB_IMAGE: ${{ needs.docker.outputs.webImage }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_API" ] || [ -z "$RENDER_DEPLOY_HOOK_WEB" ]; then
            echo "Render deploy hooks are not configured for this environment; skipping deploy."
            exit 0
          fi

          curl -fsS -X POST -G "$RENDER_DEPLOY_HOOK_API" --data-urlencode "imgURL=${API_IMAGE}"
          curl -fsS -X POST -G "$RENDER_DEPLOY_HOOK_WEB" --data-urlencode "imgURL=${WEB_IMAGE}"
