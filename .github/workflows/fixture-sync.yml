name: Fixture Sync

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Fixture provider
        type: choice
        options:
          - LiveFootballOnTv
          - Mock
        default: LiveFootballOnTv

jobs:
  sync:
    name: Sync Fixtures
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    concurrency:
      group: fixture-sync-${{ github.ref_name == 'main' && 'production' || 'preview' }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker metadata (fixture-sync)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO }}-fixture-sync
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      - name: Run fixture sync
        env:
          ConnectionStrings__Database: ${{ secrets.DATABASE_CONNECTION_STRING }}
          FixtureSync__Provider: ${{ inputs.provider }}
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          docker run --rm \
            -e ConnectionStrings__Database \
            -e FixtureSync__Provider \
            "$IMAGE"
