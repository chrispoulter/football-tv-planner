services:
  soccer-tv-schedule-web:
    image: soccer-tv-schedule-web:latest
    build:
      context: ./SoccerTv.Web
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: https://localhost:7257
      # VITE_RUNTIME_VALUE_1: DOCKER_RUNTIME_VALUE_1
      # VITE_RUNTIME_VALUE_2: DOCKER_RUNTIME_VALUE_2
    ports:
      - 5173:80

  soccer-tv-schedule-api:
    image: soccer-tv-schedule-api:latest
    build:
      context: .
      dockerfile: ./SoccerTv.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8081;http://+:8080
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: password
      ConnectionStrings__Database: Host=host.docker.internal;Port=5432;Database=soccer_tv_schedule;Username=postgres;Password=password
      ConnectionStrings__Mail: Endpoint=smtp://host.docker.internal:1025
      Email__SiteUrl: http://localhost:5173
      Email__NoReplyAddress: noreply@example.com
      Jwt__SecurityKey: super_secret_key_that_should_be_changed
      Seed__Users__0__EmailAddress: system.administrator@example.com
      Seed__Users__0__Password: super_secret_password_that_should_be_changed
      Logging__LogLevel__Microsoft.AspNetCore.DataProtection: Error
      OTEL_SERVICE_NAME: soccer-tv-schedule-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-otel-lgtm:4317
    ports:
      - 5257:8080
      - 7257:8081
    volumes:
      - ${USERPROFILE}/.aspnet/https:/https:ro
    depends_on:
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
      # grafana-otel-lgtm:
      #   condition: service_started

  # Runs one sync and exits; `docker compose run soccer-tv-schedule-fixture-sync` to refresh.
  soccer-tv-schedule-fixture-sync:
    image: soccer-tv-schedule-fixture-sync:latest
    build:
      context: .
      dockerfile: ./SoccerTv.FixtureSync/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=host.docker.internal;Port=5432;Database=soccer_tv_schedule;Username=postgres;Password=password
      OTEL_SERVICE_NAME: soccer-tv-schedule-fixture-sync
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    restart: "no"
    depends_on:
      soccer-tv-schedule-api:
        condition: service_started

  postgres:
    image: postgres:18.3
    user: postgres
    environment:
      POSTGRES_DB: soccer_tv_schedule
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 3

  mailpit:
    image: axllent/mailpit:v1.22.3
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - 1025:1025
      - 8025:8025
    volumes:
      - mailpit_data:/data
    restart: always

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - 18888:18888
      - 4317:18889
      - 4318:18890
    restart: always

  # grafana-otel-lgtm:
  #   image: grafana/otel-lgtm:latest
  #   ports:
  #     - 3000:3000
  #     - 4317:4317
  #     - 4318:4318
  #   volumes:
  #     - grafana_lgtm_data:/data
  #   restart: always

volumes:
  postgres_data:
  mailpit_data:
  # grafana_lgtm_data:
