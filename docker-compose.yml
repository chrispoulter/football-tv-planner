services:
  football-tv-planner-server:
    image: football-tv-planner-server:latest
    build:
      context: .
      dockerfile: ./FootballTvPlanner.Server/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8081;http://+:8080
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: password
      ConnectionStrings__Database: Host=host.docker.internal;Port=5432;Database=football_tv_planner;Username=postgres;Password=password
      ConnectionStrings__Mail: Endpoint=smtp://host.docker.internal:1025
      Email__SiteUrl: http://localhost:5257
      Email__FromAddress: football-tv-planner@chrispoulter.com
      # VITE_FEATURE_X: ${VITE_FEATURE_X:-}
      Logging__Console__FormatterName: json
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: server
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
    ports:
      - 5257:8080
      - 7257:8081
    volumes:
      - ${USERPROFILE}/.aspnet/https:/https:ro
    depends_on:
      football-tv-planner-migrations:
        condition: service_completed_successfully

  football-tv-planner-fixture-sync:
    image: football-tv-planner-fixture-sync:latest
    build:
      context: .
      dockerfile: ./FootballTvPlanner.FixtureSync/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=host.docker.internal;Port=5432;Database=football_tv_planner;Username=postgres;Password=password
      FixtureSync__Provider: Mock
      Logging__Console__FormatterName: json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: fixture-sync
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
    restart: "no"
    depends_on:
      football-tv-planner-migrations:
        condition: service_completed_successfully

  football-tv-planner-migrations:
    image: football-tv-planner-migrations:latest
    build:
      context: .
      dockerfile: ./FootballTvPlanner.MigrationService/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=host.docker.internal;Port=5432;Database=football_tv_planner;Username=postgres;Password=password
      Logging__Console__FormatterName: json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: migrations
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started

  postgres:
    image: postgres:18.3
    user: postgres
    environment:
      POSTGRES_DB: football_tv_planner
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 3

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - 1025:1025
      - 8025:8025
    restart: always

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - 18888:18888
    restart: always

volumes:
  postgres_data:
