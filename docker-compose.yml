services:
  football-tv-planner-web:
    image: football-tv-planner-web:latest
    build:
      context: ./FootballTvPlanner.Web
      dockerfile: Dockerfile
    environment:
      API_URL: http://football-tv-planner-api:8080
      # VITE_FEATURE_X: ${VITE_FEATURE_X:-}
    ports:
      - 5173:80
    depends_on:
      football-tv-planner-api:
        condition: service_started

  football-tv-planner-api:
    image: football-tv-planner-api:latest
    build:
      context: .
      dockerfile: ./FootballTvPlanner.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8081;http://+:8080
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: password
      ConnectionStrings__Database: Host=host.docker.internal;Port=5432;Database=football_tv_planner;Username=postgres;Password=password
      ConnectionStrings__Mail: Endpoint=smtp://host.docker.internal:1025
      Email__SiteUrl: http://localhost:5173
      Email__NoReplyAddress: noreply@example.com
      Logging__Console__FormatterName: json
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
    ports:
      - 5257:8080
      - 7257:8081
    volumes:
      - ${USERPROFILE}/.aspnet/https:/https:ro
    depends_on:
      postgres:
        condition: service_healthy

  football-tv-planner-fixture-sync:
    image: football-tv-planner-fixture-sync:latest
    build:
      context: .
      dockerfile: ./FootballTvPlanner.FixtureSync/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=host.docker.internal;Port=5432;Database=football_tv_planner;Username=postgres;Password=password
      Logging__Console__FormatterName: json
    restart: "no"
    depends_on:
      football-tv-planner-api:
        condition: service_started

  postgres:
    image: postgres:18.3
    user: postgres
    environment:
      POSTGRES_DB: football_tv_planner
      POSTGRES_PASSWORD: password
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 3

  mailpit:
    image: axllent/mailpit:v1.22.3
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - 1025:1025
      - 8025:8025
    volumes:
      - mailpit_data:/data
    restart: always

volumes:
  postgres_data:
  mailpit_data:
